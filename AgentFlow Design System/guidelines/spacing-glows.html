<!-- @dsCard group="Spacing" viewport="700x160" name="Borders & Glows" subtitle="Status glow shadows + scanline texture" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/><style>body{margin:0;background:var(--bg-base);padding:20px;font-family:var(--font-body);color:var(--text-primary)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted)}</style></head><body>
<div style="display:flex;gap:14px;align-items:stretch">
<div style="flex:1;height:64px;background:var(--bg-surface);border-radius:6px;box-shadow:var(--glow-running);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px"><span class="lbl">running</span></div><div style="flex:1;height:64px;background:var(--bg-surface);border-radius:6px;box-shadow:var(--glow-waiting);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px"><span class="lbl">waiting</span></div><div style="flex:1;height:64px;background:var(--bg-surface);border-radius:6px;box-shadow:var(--glow-done);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px"><span class="lbl">done</span></div><div style="flex:1;height:64px;background:var(--bg-surface);border-radius:6px;box-shadow:var(--glow-error);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px"><span class="lbl">error</span></div><div style="flex:1;height:64px;background:var(--bg-surface);border-radius:6px;box-shadow:var(--glow-brand);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px"><span class="lbl">brand</span></div>
</div>
<div style="margin-top:14px;height:46px;border:1px solid var(--border);border-radius:6px;background:var(--bg-surface) var(--scanlines);display:flex;align-items:center;padding-left:14px"><span class="lbl">--scanlines · CRT panel texture</span></div>
</body></html>
