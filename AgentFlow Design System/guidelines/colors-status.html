<!-- @dsCard group="Colors" viewport="700x150" name="Status Accents" subtitle="running, waiting, idle, done, error" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/><style>body{margin:0;background:var(--bg-base);padding:20px;font-family:var(--font-body);color:var(--text-primary)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted)}</style></head><body>
<div style="display:flex;gap:12px">
<div style="flex:1;text-align:center"><div style="height:64px;background:var(--status-running);border-radius:4px;box-shadow:0 0 14px #00E5A066"></div><div class="lbl" style="margin-top:8px;color:var(--status-running)">Running</div><div class="lbl">#00E5A0</div></div><div style="flex:1;text-align:center"><div style="height:64px;background:var(--status-waiting);border-radius:4px;box-shadow:0 0 14px #F5C54266"></div><div class="lbl" style="margin-top:8px;color:var(--status-waiting)">Waiting</div><div class="lbl">#F5C542</div></div><div style="flex:1;text-align:center"><div style="height:64px;background:var(--status-idle);border-radius:4px;box-shadow:0 0 14px #4A506866"></div><div class="lbl" style="margin-top:8px;color:var(--status-idle)">Idle</div><div class="lbl">#4A5068</div></div><div style="flex:1;text-align:center"><div style="height:64px;background:var(--status-done);border-radius:4px;box-shadow:0 0 14px #4D9FFF66"></div><div class="lbl" style="margin-top:8px;color:var(--status-done)">Done</div><div class="lbl">#4D9FFF</div></div><div style="flex:1;text-align:center"><div style="height:64px;background:var(--status-error);border-radius:4px;box-shadow:0 0 14px #FF4D6D66"></div><div class="lbl" style="margin-top:8px;color:var(--status-error)">Error</div><div class="lbl">#FF4D6D</div></div>
</div></body></html>
