<!-- @dsCard group="Components" viewport="700x250" name="Status, Progress & Tags" subtitle="StatusBadge, ProgressBar, Tag" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-base); padding: 22px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; max-width: 640px; margin-bottom: 16px; }
  .cap { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { StatusBadge, ProgressBar, Tag } = window.AgentFlowDesignSystem_98d862;
  function Demo() {
    return (
      <div>
        <p className="cap">Status badges</p>
        <div className="row">
          <StatusBadge status="running" /><StatusBadge status="waiting" />
          <StatusBadge status="idle" /><StatusBadge status="done" /><StatusBadge status="error" />
        </div>
        <p className="cap">Progress (status-glow)</p>
        <div className="bars">
          <ProgressBar value={72} status="running" />
          <ProgressBar value={40} status="waiting" />
          <ProgressBar value={100} status="done" />
          <ProgressBar value={28} status="error" />
        </div>
        <p className="cap">Tags &amp; severities</p>
        <div className="row">
          <Tag severity="HIGH" /><Tag severity="MED" /><Tag severity="LOW" />
          <Tag tone="brand">PTY</Tag><Tag tone="done">PASS</Tag><Tag tone="error">FAIL</Tag><Tag>CLAUDE</Tag>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
