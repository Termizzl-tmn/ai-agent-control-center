<!-- @dsCard group="Components" viewport="700x420" name="Pixel Office" subtitle="Animated pixel-art agent office — canvas game loop, click to select" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-base); padding: 18px; }
  .hint { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); margin: 12px 2px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { PixelOffice } = window.AgentFlowDesignSystem_98d862;
  const AGENTS = [
    { id: 'a1', name: 'Spec Agent', role: 'po', status: 'done' },
    { id: 'a2', name: 'Planner Agent', role: 'pm', status: 'waiting' },
    { id: 'a3', name: 'Arch Agent', role: 'techlead', status: 'idle' },
    { id: 'a4', name: 'Code Agent', role: 'dev', status: 'running' },
    { id: 'a5', name: 'Test Agent', role: 'qa', status: 'running' },
    { id: 'a6', name: 'Deploy Agent', role: 'devops', status: 'idle' },
    { id: 'a7', name: 'Notifier', role: 'notifier', status: 'done' },
  ];
  function Demo() {
    const [sel, setSel] = React.useState(null);
    return (
      <div>
        <PixelOffice agents={AGENTS} height={360} selectedId={sel && sel.id} onSelectAgent={setSel} />
        <div className="hint">{sel ? `Selected: ${sel.name} · ${sel.role.toUpperCase()} · ${sel.status}` : 'Click a character to select. Idle agents wander to the coffee machine.'}</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
