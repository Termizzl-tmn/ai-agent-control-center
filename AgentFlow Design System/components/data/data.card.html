<!-- @dsCard group="Components" viewport="700x360" name="Agent Card, Panel, Stats & Log" subtitle="AgentCard, Panel, StatCard, LogLine" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-base); padding: 22px; }
  .wrap { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { AgentCard, Panel, StatCard, LogLine } = window.AgentFlowDesignSystem_98d862;
  function Demo() {
    return (
      <div className="wrap">
        <AgentCard agentId="AGT-014" name="Code Agent" role="dev" status="running"
          description="Handles code generation and PR summaries." progress={72} tasksDone={10} tasksTotal={14} selected />
        <div>
          <div className="stats">
            <StatCard label="Active Agents" value="2 / 7" accent="var(--status-running)" />
            <StatCard label="Tokens used" value="12,450" sub="of 50,000" bar={25} accent="var(--brand)" />
          </div>
          <Panel title="Activity Log" meta="4 entries" scanlines padding={0}>
            <div style={{padding:'8px 4px'}}>
              <LogLine time="09:41:02" level="info" agent="Code" message="Fetching records from API…" lineNo={1} />
              <LogLine time="09:41:05" level="warn" message="Rate limit warning: 80%" lineNo={2} />
              <LogLine time="09:41:07" level="info" agent="Code" message="Generating unit tests…" lineNo={3} />
              <LogLine time="09:41:09" level="error" message="Connection refused: localhost:5432" current lineNo={4} />
            </div>
          </Panel>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
